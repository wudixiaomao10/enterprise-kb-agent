services:
  knowledge-postgres:
    image: pgvector/pgvector:pg16
    container_name: knowledge-postgres
    environment:
      POSTGRES_DB: knowledge
      POSTGRES_USER: knowledge
      POSTGRES_PASSWORD: knowledge
    ports:
      - "5432:5432"
    volumes:
      - knowledge-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U knowledge -d knowledge"]
      interval: 5s
      timeout: 3s
      retries: 20

  knowledge-redis:
    image: redis:7.4-alpine
    container_name: knowledge-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6380:6379"
    volumes:
      - knowledge-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  knowledge-minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: knowledge-minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: knowledge_minio
      MINIO_ROOT_PASSWORD: knowledge_minio_change_me
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - knowledge-minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  knowledge-postgres-data:
  knowledge-redis-data:
  knowledge-minio-data:
